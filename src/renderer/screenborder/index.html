<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <title>Smaran Screen Border Light</title>
    <style>
      @property --ring-a {
        syntax: '<angle>';
        inherits: false;
        initial-value: 0deg;
      }
      @property --ring-len {
        syntax: '<angle>';
        inherits: false;
        initial-value: 100deg;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: transparent !important;
        pointer-events: none;
        user-select: none;
      }

      .border-container {
        position: fixed;
        inset: 0;
        pointer-events: none;
        animation: border-fade-in 240ms cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      .screen-ring-light {
        position: absolute;
        inset: 0;
        padding: 4px;
        pointer-events: none;
        background: conic-gradient(
          from var(--ring-a),
          transparent 0deg,
          #4285f4 calc(var(--ring-len) * 0.2),
          #ea4335 calc(var(--ring-len) * 0.45),
          #fbbc05 calc(var(--ring-len) * 0.68),
          #34a853 calc(var(--ring-len) * 0.86),
          transparent var(--ring-len),
          transparent 360deg
        );
        -webkit-mask:
          linear-gradient(#000 0 0) content-box,
          linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        animation:
          ring-spin 3.8s cubic-bezier(0.55, 0.12, 0.45, 0.88) infinite,
          ring-len 2.9s ease-in-out infinite alternate;
      }

      .screen-ring-glow {
        position: absolute;
        inset: 0;
        padding: 12px;
        filter: blur(8px);
        opacity: 0.65;
        pointer-events: none;
        background: conic-gradient(
          from var(--ring-a),
          transparent 0deg,
          #4285f4 calc(var(--ring-len) * 0.2),
          #ea4335 calc(var(--ring-len) * 0.45),
          #fbbc05 calc(var(--ring-len) * 0.68),
          #34a853 calc(var(--ring-len) * 0.86),
          transparent var(--ring-len),
          transparent 360deg
        );
        -webkit-mask:
          linear-gradient(#000 0 0) content-box,
          linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        animation:
          ring-spin 3.8s cubic-bezier(0.55, 0.12, 0.45, 0.88) infinite,
          ring-len 2.9s ease-in-out infinite alternate;
      }

      /* Subtle hairline border around screen to define edge */
      .screen-edge-track {
        position: absolute;
        inset: 0;
        border: 1px solid rgba(255, 255, 255, 0.12);
        pointer-events: none;
      }

      @keyframes ring-spin {
        to {
          --ring-a: 360deg;
        }
      }

      @keyframes ring-len {
        from {
          --ring-len: 70deg;
        }
        to {
          --ring-len: 150deg;
        }
      }

      @keyframes border-fade-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .screen-ring-light,
        .screen-ring-glow {
          animation: none !important;
          opacity: 0.35 !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="border-container">
      <div class="screen-edge-track" aria-hidden="true"></div>
      <div class="screen-ring-glow" aria-hidden="true"></div>
      <div class="screen-ring-light" aria-hidden="true"></div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
