<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <title>Smaran Screen Border Light</title>
    <style>
      :root {
        --border-thickness: 4px;
        --border-brightness: 1.5;
      }

      @property --ring-a {
        syntax: '<angle>';
        inherits: false;
        initial-value: 0deg;
      }
      @property --ring-len {
        syntax: '<angle>';
        inherits: false;
        initial-value: 120deg;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: transparent !important;
        pointer-events: none;
        user-select: none;
      }

      .border-container {
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        transition: opacity 350ms cubic-bezier(0.16, 1, 0.3, 1);
        will-change: opacity;
      }

      .border-container.is-visible {
        opacity: 1;
      }

      .border-container.is-fading-out {
        opacity: 0;
        transition: opacity 350ms cubic-bezier(0.4, 0, 0.2, 1);
      }

      /* Ambient wide bloom casting soft radiance around display edges */
      .screen-ring-ambient {
        position: absolute;
        inset: 0;
        padding: calc(var(--border-thickness, 4px) + 26px);
        filter: blur(28px) brightness(var(--border-brightness, 1.5));
        opacity: calc(0.6 * (var(--border-brightness, 1.5) / 1.5));
        mix-blend-mode: screen;
        pointer-events: none;
        background: conic-gradient(
          from var(--ring-a),
          transparent 0deg,
          #0091ff calc(var(--ring-len) * 0.18),
          #ff2a55 calc(var(--ring-len) * 0.44),
          #ffb800 calc(var(--ring-len) * 0.68),
          #00e676 calc(var(--ring-len) * 0.88),
          transparent var(--ring-len),
          transparent 360deg
        );
        -webkit-mask:
          linear-gradient(#000 0 0) content-box,
          linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        animation:
          ring-spin 3.8s cubic-bezier(0.55, 0.12, 0.45, 0.88) infinite,
          ring-len 2.9s ease-in-out infinite alternate;
      }

      /* High-intensity outer glow */
      .screen-ring-glow {
        position: absolute;
        inset: 0;
        padding: calc(var(--border-thickness, 4px) + 10px);
        filter: blur(10px) brightness(var(--border-brightness, 1.5));
        opacity: calc(0.85 * (var(--border-brightness, 1.5) / 1.5));
        pointer-events: none;
        background: conic-gradient(
          from var(--ring-a),
          transparent 0deg,
          #0091ff calc(var(--ring-len) * 0.18),
          #ff2a55 calc(var(--ring-len) * 0.44),
          #ffb800 calc(var(--ring-len) * 0.68),
          #00e676 calc(var(--ring-len) * 0.88),
          transparent var(--ring-len),
          transparent 360deg
        );
        -webkit-mask:
          linear-gradient(#000 0 0) content-box,
          linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        animation:
          ring-spin 3.8s cubic-bezier(0.55, 0.12, 0.45, 0.88) infinite,
          ring-len 2.9s ease-in-out infinite alternate;
      }

      /* Core crisp light beam */
      .screen-ring-light {
        position: absolute;
        inset: 0;
        padding: var(--border-thickness, 4px);
        pointer-events: none;
        background: conic-gradient(
          from var(--ring-a),
          transparent 0deg,
          #0091ff calc(var(--ring-len) * 0.18),
          #ff2a55 calc(var(--ring-len) * 0.44),
          #ffb800 calc(var(--ring-len) * 0.68),
          #00e676 calc(var(--ring-len) * 0.88),
          transparent var(--ring-len),
          transparent 360deg
        );
        -webkit-mask:
          linear-gradient(#000 0 0) content-box,
          linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        filter: drop-shadow(0 0 6px currentColor) drop-shadow(0 0 16px rgba(255, 255, 255, 0.45))
          brightness(var(--border-brightness, 1.5)) saturate(1.4);
        animation:
          ring-spin 3.8s cubic-bezier(0.55, 0.12, 0.45, 0.88) infinite,
          ring-len 2.9s ease-in-out infinite alternate;
      }

      /* High-luminance white-hot core accent */
      .screen-ring-core {
        position: absolute;
        inset: 0;
        padding: max(1px, calc(var(--border-thickness, 4px) * 0.35));
        pointer-events: none;
        background: conic-gradient(
          from var(--ring-a),
          transparent 0deg,
          #ffffff calc(var(--ring-len) * 0.18),
          #ffffff calc(var(--ring-len) * 0.44),
          #ffffff calc(var(--ring-len) * 0.68),
          #ffffff calc(var(--ring-len) * 0.88),
          transparent var(--ring-len),
          transparent 360deg
        );
        -webkit-mask:
          linear-gradient(#000 0 0) content-box,
          linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        filter: brightness(2) drop-shadow(0 0 4px #ffffff);
        opacity: calc(0.65 * (var(--border-brightness, 1.5) / 1.5));
        animation:
          ring-spin 3.8s cubic-bezier(0.55, 0.12, 0.45, 0.88) infinite,
          ring-len 2.9s ease-in-out infinite alternate;
      }

      /* Subtle hairline border around screen to define crisp display edge */
      .screen-edge-track {
        position: absolute;
        inset: 0;
        border: 1px solid rgba(255, 255, 255, 0.18);
        pointer-events: none;
      }

      @keyframes ring-spin {
        to {
          --ring-a: 360deg;
        }
      }

      @keyframes ring-len {
        from {
          --ring-len: 80deg;
        }
        to {
          --ring-len: 160deg;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .screen-ring-light,
        .screen-ring-glow,
        .screen-ring-ambient,
        .screen-ring-core {
          animation: none !important;
          opacity: 0.35 !important;
        }
        .border-container {
          transition: opacity 60ms ease !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="border-container">
      <div class="screen-edge-track" aria-hidden="true"></div>
      <div class="screen-ring-ambient" aria-hidden="true"></div>
      <div class="screen-ring-glow" aria-hidden="true"></div>
      <div class="screen-ring-light" aria-hidden="true"></div>
      <div class="screen-ring-core" aria-hidden="true"></div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
