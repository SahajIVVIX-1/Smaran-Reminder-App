<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <title>Smaran Screen Border Light</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: transparent !important;
        pointer-events: none;
        user-select: none;
      }

      .border-container {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
        opacity: 0;
        transition: opacity 350ms cubic-bezier(0.16, 1, 0.3, 1);
        will-change: opacity;
      }

      .border-container.is-visible {
        opacity: 1;
      }

      .border-container.is-fading-out {
        opacity: 0;
        transition: opacity 350ms cubic-bezier(0.4, 0, 0.2, 1);
      }

      #border-canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
      }

      @media (prefers-reduced-motion: reduce) {
        .border-container {
          transition: opacity 60ms ease !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="border-container" id="border-container">
      <canvas id="border-canvas"></canvas>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
