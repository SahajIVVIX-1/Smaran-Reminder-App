# Packaging config. Every build lands in its own versioned folder:
#   release/<version>/installer/Smaran-Setup-<version>.exe
#   release/<version>/portable/Smaran-<version>-portable.exe
#   release/<version>/win-unpacked/   (unpacked app, useful for quick testing)
#
# Only the portable exe is built here. scripts/make-setup.mjs copies it to the Setup name;
# run under that name, the app installs itself with its own animated window (src/main/setup)
# instead of the old NSIS wizard.
appId: com.sahaj.smaran
productName: Smaran
directories:
  output: release/${version}
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  - from: resources/engine
    to: engine
  - from: resources/tray
    to: tray
  - from: resources/icon.png
    to: icon.png
  - from: resources
    to: resources
win:
  icon: build/icon.ico
  target:
    - target: portable
      arch: [x64]
portable:
  artifactName: portable/${productName}-${version}-portable.${ext}
